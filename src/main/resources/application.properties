spring.application.name=pedidos360-backend

# Seccion 4.4: Cambiar puerto de la aplicacion a 8888 para EC2
server.port=8888

# Seccion 20.2: Configuracion de Cognito como Emisor (Issuer) de tokens JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_C1DQHPBOn

# Configuracion de Base de Datos H2 y JPA / Hibernate
spring.datasource.url=jdbc:h2:mem:pedidosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Consola H2 (accesible para depurar tablas)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
