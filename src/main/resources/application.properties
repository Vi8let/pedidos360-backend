spring.application.name=pedidos360-backend
server.port=8888

# Seccion 20.2: Configuracion de Cognito como Emisor (Issuer) de tokens JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_C1DQHPBOn}

# =========================================================================
# Frontend origin(s), comma-separated when more than one
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# =========================================================================
# CONFIGURACION DE BASE DE DATOS POSTGRESQL (Base: pedidos360_db)
# =========================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/pedidos360_db
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================================================================
# CONFIGURACION DE RABBITMQ (PRODUCER / BROKER)
# =========================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Publisher Confirms y Mandatory para confiabilidad de entrega
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Listeners (si existieran en este proceso). El consumo real vive en pedidos360-consumer.
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.prefetch=1

# RabbitMQ Management API (para RabbitAdminService)
rabbit.admin.url=${RABBIT_ADMIN_URL:http://${RABBITMQ_HOST:localhost}:15672/api}
rabbit.admin.user=${RABBITMQ_USER:guest}
rabbit.admin.password=${RABBITMQ_PASSWORD:guest}
